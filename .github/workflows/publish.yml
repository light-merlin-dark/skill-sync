name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
      commit:
        description: Exact main-branch commit to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify requested source
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
      - run: npm ci
      - run: npm run prepublishOnly
      - name: Verify reproducible tracked output
        run: git diff --exit-code
      - run: npm pack --dry-run --json
      - name: Publish through npm trusted publishing
        run: npm publish --access public --ignore-scripts
